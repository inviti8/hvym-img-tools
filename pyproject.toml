[project]
name = "hvym-img-tools"
version = "0.1.0"
description = "Self-hosted, AI-augmented image tools for creative apps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.1",
    "trimesh>=4.0",
    # trimesh 5 delegates simplify_quadric_decimation to this; the `mesh` tool
    # must decimate (raw backbone output is up to 1.2M faces / 20.8 MB), and it
    # is CPU-only, so it belongs in the base install rather than the gpu extra.
    "fast-simplification>=0.1.7",
    # trimesh delegates `unwrap()` to this. The `mesh` tool needs a UV atlas
    # whenever it bakes a texture, and it is a small CPU-only wheel.
    "xatlas>=0.0.9",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# The GPU/serving stack. Kept out of the base install so `core` stays
# CPU-importable and tests run without a GPU (AGENTS.md §6).
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
# The always-on authenticating proxy (proxy.py). This list IS the dependency set
# of docker/Dockerfile.proxy -- keep the two in step. It is deliberately short:
# the proxy's whole design constraint is being small enough to share the cheapest
# box available, so nothing goes in here that only saves a few lines of code.
proxy = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # ed25519 verification for signed wallet identity (core/identity.py). The
    # Stellar strkey codec and the Horizon calls are done by hand against this
    # rather than pulling stellar-sdk's tree into the image; test_billing.py
    # cross-checks the codec against the real SDK so that stays honest.
    "pynacl>=1.5",
]
gpu = [
    "torch>=2.4",
    "transformers>=4.35,<5",      # v5 renamed ViT weights; breaks the TripoSR ckpt
    "onnxruntime-gpu==1.22.0",    # 1.29 is a CUDA-13 build; silently falls back to CPU
    "einops>=0.7",
    "omegaconf>=2.3",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hvym-img = "hvym_img_tools.cli:main"
hvym-img-serve = "hvym_img_tools.core.server:main"
hvym-img-proxy = "hvym_img_tools.proxy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hvym_img_tools"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pynacl>=1.5",
    # Only so tests/test_billing.py can check our hand-rolled strkey codec
    # against the real implementation. Never imported by the proxy itself.
    "stellar-sdk>=13.0",
]
